name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libx11-6 libxcursor1 shellcheck
      - run: pip install python-xlib pytest
      - run: pytest -q
      - run: shellcheck -S warning install.sh
